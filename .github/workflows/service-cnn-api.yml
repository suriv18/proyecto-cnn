name: service-cnn-api

# Pruebas del backend de solo lectura (service-cnn/src/api). También corre cuando cambia el contrato
# de la interfaz (app-quinuaprod/api/openapi.yaml), porque las respuestas se validan contra ese YAML.
on:
  push:
    paths:
      - 'service-cnn/src/api/**'
      - 'service-cnn/tests/api/**'
      - 'service-cnn/pyproject.toml'
      - 'app-quinuaprod/api/openapi.yaml'
      - '.github/workflows/service-cnn-api.yml'
  pull_request:
    paths:
      - 'service-cnn/src/api/**'
      - 'service-cnn/tests/api/**'
      - 'service-cnn/pyproject.toml'
      - 'app-quinuaprod/api/openapi.yaml'
      - '.github/workflows/service-cnn-api.yml'

defaults:
  run:
    working-directory: service-cnn

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: service-cnn/pyproject.toml
      # Solo lo que usa src/api y sus pruebas. No se instala el proyecto completo: arrastraría torch,
      # shap y xgboost, que el servicio no necesita. Mantener alineado con pyproject.toml (extras api y dev).
      - run: python -m pip install "pandas>=2.2" "pyyaml>=6" "fastapi>=0.115" "httpx>=0.27" "jsonschema>=4.22" "pytest>=8"
      # Los reports/ del piloto no se versionan: las pruebas con datos reales se omiten aquí. El contrato,
      # la regla de campañas externas, los errores y CORS se prueban con datos sintéticos.
      - run: python -m pytest tests/api -q -rs
