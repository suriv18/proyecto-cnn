name: app-quinuaprod

on:
  push:
    paths: ['app-quinuaprod/**', '.github/workflows/app-quinuaprod.yml']
  pull_request:
    paths: ['app-quinuaprod/**', '.github/workflows/app-quinuaprod.yml']

defaults:
  run:
    working-directory: app-quinuaprod

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-quinuaprod/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app-quinuaprod/playwright-report
          retention-days: 7
