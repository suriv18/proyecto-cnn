name: app-quinuaprod

on:
  push:
    paths: ['app-quinuaprod/**', '.github/workflows/app-quinuaprod.yml']
  pull_request:
    paths: ['app-quinuaprod/**', '.github/workflows/app-quinuaprod.yml']

defaults:
  run:
    working-directory: app-quinuaprod

jobs:
  calidad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-quinuaprod/package-lock.json
      - run: npm ci
      # Falla si alguien cambió openapi.yaml sin regenerar los tipos, o editó schema.d.ts a mano.
      - name: Los tipos generados coinciden con el contrato
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app-quinuaprod/playwright-report
          retention-days: 7
