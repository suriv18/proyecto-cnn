  benchmarks: {valor: [B1, B2, B3], estado: fijado_por_tesis, fuente: "Tabla 8; no se optimizan"}
  benchmark_secundario_persistencia: {valor: B4, estado: propuesto, fuente: "recomendación en rol de asesor (docs/crisp/Decisiones-asesor-simuladas.md): repite la última campaña de entrenamiento de la provincia; descriptivo, fuera de la familia de Holm; no se optimiza"}
  presupuesto_de_trials_por_modelo: {valor: 30, estado: propuesto, fuente: "src/models/tuning.py; igual para los 5 modelos (4.12.3); el piloto confirma el costo"}
  muestreador_de_hiperparametros: {valor: tpe, estado: fijado_por_tesis, fuente: "4.12.3 (Optuna, Sabo et al. 2023)"}
  espacios_de_busqueda: {valor: "configs/hyperparams.yaml", estado: por_decidir_piloto, fuente: "4.12.3: se publican y congelan antes de la evaluación; hoy son un marcador"}
  submuestreo_de_xgboost: {valor: "subsample y colsample_bytree en [0.6, 1.0] dentro del espacio de búsqueda", estado: por_decidir_piloto, fuente: "con los valores por defecto XGBoost es determinista y las 10 semillas de 4.12.4 serían idénticas (corrida técnica, P6); el piloto oficial lo confirma"}
  entrenamiento_cnn1d:
    optimizador: {valor: adam, estado: fijado, fuente: "src/models/cnn1d_trainer.py"}
    early_stopping_particion: {valor: "temporal: la última campaña del entrenamiento", estado: por_decidir_piloto, fuente: "BRECHA G1: el código usa una partición ALEATORIA del 20 % (4.12.2 exige temporal)"}
    restaurar_mejor_epoca: {valor: true, estado: por_decidir_piloto, fuente: "BRECHA G2: el código devuelve el modelo de la última época"}
    epocas_maximas: {valor: null, estado: por_decidir_piloto, fuente: "se fija con la curva de pérdida del piloto"}
    paciencia: {valor: 10, estado: propuesto, fuente: "TrainingConfig"}
  imputacion_residual_de_celdas_vacias: {valor: "mediana de las campañas de entrenamiento por variable y fase, para los 5 modelos", estado: propuesto, fuente: "4.12.2; la misma información para todos (Tabla 8); afecta al 5 % de las observaciones"}
  estandarizacion_del_objetivo: {valor: "z-score con la media y la desviación del entrenamiento del pliego, para los 5 modelos; las predicciones se invierten a kg/ha", estado: propuesto, fuente: "los espacios de búsqueda (epsilon de SVR, C, alpha) suponen un objetivo estandarizado; el rendimiento está en kg/ha (~1 000)"}
  estandarizacion: {valor: "z-score por variable y fase, ajustado solo con el entrenamiento del pliegue", estado: fijado_por_tesis, fuente: "4.12.2"}

variable_objetivo:
