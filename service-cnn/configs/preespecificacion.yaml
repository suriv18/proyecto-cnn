  comparador_confirmatorio: {valor: xgboost, estado: fijado_por_tesis, fuente: "Tabla 8"}
  benchmark_de_superioridad: {valor: B2, estado: fijado_por_tesis, fuente: "3.3.2"}
  unidad_del_contraste: {valor: "campaña externa", estado: fijado_por_tesis, fuente: "3.3"}
  estadistico_he1a: {valor: "mediana de q_f = RMSE(CNN-1D)/RMSE(XGBoost) - 1; H0: mediana >= 0.05", estado: fijado_por_tesis, fuente: "3.3.1"}
  estadistico_he1b: {valor: "mediana de Δ_f = RMSE(CNN-1D) - RMSE(B2); H0: mediana >= 0", estado: fijado_por_tesis, fuente: "3.3.2"}
  intervalo_de_confianza: {valor: "límite superior unilateral al 95 % por bootstrap de bloques de campaña", estado: fijado_por_tesis, fuente: "4.14"}
  n_bootstrap: {valor: 10000, estado: propuesto, fuente: "con 5 campañas externas solo hay 5^5 = 3125 remuestreos distintos; más de 10 000 no aporta"}
  semilla_bootstrap: {valor: 2026, estado: propuesto, fuente: "reproducibilidad"}
  contraste_de_apoyo: {valor: "Wilcoxon pareado unilateral, Hodges-Lehmann y correlación biserial de rangos", estado: fijado_por_tesis, fuente: "3.3.1 y 4.14"}
  he1_se_respalda_si: {valor: "se cumplen HE1a y HE1b", estado: fijado_por_tesis, fuente: "3.3.2"}
  he2:
    estabilidad_w_kendall_minimo: {valor: 0.70, estado: fijado_por_tesis, fuente: "3.3.3"}
    estabilidad_jaccard_minimo: {valor: 0.50, estado: fijado_por_tesis, fuente: "3.3.3"}
    n_fases_principales: {valor: 3, estado: fijado_por_tesis, fuente: "3.3.3"}
    fases_criticas_horizonte_principal: {valor: [floracion, llenado_grano], estado: fijado_por_tesis, fuente: "3.3.5 (Vásquez et al., 2024)"}
    fases_criticas_horizonte_temprano: {valor: [floracion], estado: fijado_por_tesis, fuente: "3.3.5"}
    correccion_por_multiplicidad: {valor: holm, estado: fijado_por_tesis, fuente: "3.3.5"}
    familia_de_contrastes: {valor: [estabilidad, fidelidad, concordancia], estado: fijado_por_tesis, fuente: "3.3.5"}
    he2_se_respalda_si: {valor: "se cumplen estabilidad, fidelidad y concordancia a la vez", estado: fijado_por_tesis, fuente: "3.3.5"}
  hipotesis_general_conjuntiva: {valor: true, estado: fijado_por_tesis, fuente: "3.1"}

