politica_de_desviaciones:
  regla: {valor: "toda desviación posterior al congelamiento se registra como enmienda fechada y trazable; no se ajustan umbrales, márgenes ni comparador tras ver resultados de las campañas externas", estado: fijado_por_tesis, fuente: "4.18 y 6"}
