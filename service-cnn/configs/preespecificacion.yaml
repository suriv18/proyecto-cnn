# Preespecificación (E5) — BORRADOR. Fase F3 de CRISP-ML(Q), hito H2.
#
# Fuente única de verdad del registro fechado de hipótesis, márgenes, comparador,
# umbrales de HE2, horizontes, espacios de búsqueda y reglas de depuración
# (sección 4.18 de la tesis). El texto legible se genera con
# `python scripts/render_e5.py` y la coherencia con el código se verifica con
# `src.evaluation.preregistration.check_consistency_with_code`.
#
# Cada parámetro es {valor, estado, fuente} con estado:
#   fijado_por_tesis      lo establece la tesis; no se discute.
#   fijado                revisado y aprobado; ya no cambia.
#   propuesto             valor razonado por quien redacta; revisar y pasarlo a `fijado`.
#   por_decidir_piloto    lo determina el ensayo piloto SIN usar campañas externas.
#   por_decidir_asesor    requiere decisión del asesor.
# El documento solo puede congelarse (H2) cuando no queda ningún `propuesto` ni `por_decidir_*`.
# Una vez congelado, todo cambio exige una enmienda fechada y trazable; no se ajusta
# ningún umbral después de ver resultados de las campañas externas.

metadatos:
  estado_documento: "BORRADOR"
  version: "0.1"
  fecha_borrador: "2026-10-10"
  fecha_congelamiento: null
  commit_congelamiento: null
  sha256_conjunto_de_datos: null   # se registra al congelar (data/processed/tensores.npz)

hipotesis:
