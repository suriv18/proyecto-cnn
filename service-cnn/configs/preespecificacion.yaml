  unidad_del_contraste: {valor: "campaña externa", estado: fijado_por_tesis, fuente: "3.3"}
  estadistico_he1a: {valor: "q_f(R) = RMSE(CNN-1D)/RMSE(R) - 1 con R en {XGBoost, B*}; H0: mediana >= 0.05", estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 3.3.1; antes solo frente a XGBoost"}
  estadistico_he1b: {valor: "exploratorio: skill score SS_f = 1 - MSE(CNN-1D)/MSE(B*) (Murphy, 1988); H0: mediana(SS_f) <= 0", estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 3.3.2; antes: Δ_f frente a B2, confirmatorio"}
  intervalo_de_confianza: {valor: "regla exacta de signos: q_f(R) < 0.05 en todas las campañas externas (nivel 0.5^n); intervalos por bloques solo descriptivos", estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 4.14; con 5 bloques el bootstrap tiene 3125 remuestreos distintos"}
  n_bootstrap: {valor: 10000, estado: fijado, fuente: "Piloto oficial (2026-10-10): solo para los intervalos descriptivos por bloques; la decisión de HE1a usa la regla exacta de signos (con 5 campañas hay 5^5 = 3125 remuestreos distintos)"}
  semilla_bootstrap: {valor: 2026, estado: fijado, fuente: "reproducibilidad. Cerrado con el piloto oficial (2026-10-10, ronda 2); sin cambios"}
  contraste_de_apoyo: {valor: "Wilcoxon pareado unilateral, equivalencia práctica bayesiana (ROPE ±5 %), Hodges-Lehmann y correlación biserial de rangos", estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 3.3.1 y 4.14"}
  he1_se_respalda_si: {valor: "se cumple HE1a (HE1b es exploratoria)", estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 3.3.2"}
  he2:
    estabilidad_w_kendall_minimo: {valor: 0.70, estado: fijado_por_tesis, fuente: "3.3.3"}
    estabilidad_jaccard_minimo: {valor: 0.50, estado: fijado_por_tesis, fuente: "3.3.3"}
    n_fases_principales: {valor: 3, estado: fijado_por_tesis, fuente: "3.3.3"}
    fases_criticas_horizonte_principal: {valor: [floracion, llenado_grano], estado: fijado_por_tesis, fuente: "3.3.5 (Vásquez et al., 2024)"}
    fases_criticas_horizonte_temprano: {valor: [floracion], estado: fijado_por_tesis, fuente: "3.3.5"}
    correccion_por_multiplicidad: {valor: holm, estado: fijado_por_tesis, fuente: "3.3.5"}
    familia_de_contrastes: {valor: [estabilidad, fidelidad], estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 3.3.5; la concordancia es el criterio primario y queda fuera de la familia corregida"}
    valor_p_estabilidad: {valor: "permutación de las fases dentro de cada campaña (10 000 permutaciones, semilla 2026); p = max(p de W de Kendall, p del Jaccard medio de las 3 fases principales)", estado: fijado_por_tesis, fuente: "src/explainability/he2_pvalues.py; los umbrales W >= 0.70 y J >= 0.50 se conservan como criterio de magnitud"}
    valor_p_fidelidad: {valor: "aleatorización exacta con el rango del aumento de RMSE de la fase de mayor contribución entre las 5 fases ocluidas, sumado entre campañas; los empates van en contra", estado: fijado_por_tesis, fuente: "src/explainability/he2_pvalues.py; amplía el control único de 3.3.4 a las 4 fases restantes (todas de igual duración); tesis v3, 3.3.4: sustituye al control único, que con 5 campañas no pasa Holm"}
    valor_p_concordancia: {valor: "binomial exacta unilateral sobre las campañas, p0 = fases del referente / fases totales (0.4 principal, 0.2 temprano)", estado: fijado_por_tesis, fuente: "src/explainability/he2_pvalues.py; con 5 campañas solo 5/5 aciertos da p < 0.0167"}
    he2_se_respalda_si: {valor: "se cumple la concordancia agronómica (primaria); estabilidad y fidelidad son secundarias", estado: fijado_por_tesis, fuente: "Tesis v3 (decisión del autor; el asesor la revisa): 3.3.5"}
  hipotesis_general_conjuntiva: {valor: true, estado: fijado_por_tesis, fuente: "3.1"}

