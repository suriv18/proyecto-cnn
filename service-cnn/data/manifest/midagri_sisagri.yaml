# Manifiesto de datos: MIDAGRI/SIEA — Perfil Productivo de Cultivos (sección 4.18).
#
# Registro de la descarga real que reemplaza la fuente citada en la tesis
# (datosabiertos.gob.pe/dataset/midagri-información-estadística-agrícola,
# URL que ya no existe — el portal fue rediseñado).

fuente:
  nombre: "SIEA-MIDAGRI, Perfil Productivo y Competitivo de los Principales Cultivos del Sector"
  proveedor: "Ministerio de Desarrollo Agrario y Riego (MIDAGRI), Sistema Integrado de Estadística Agraria (SIEA)"
  url_portal: "https://siea.midagri.gob.pe/herramientas/estadistica-agropecuarias"
  url_descarga: "https://drive.usercontent.google.com/download?id=1ajmiK9uIYlvPZwseRXh1ko3ivHKHufKm&export=download"
  fuentes_declaradas_en_dashboard: "SISAGRI, SUNAT, CENAGRO, SISAP, Direcciones Regionales Agrarias"
  fecha_descarga: "2026-09-12"
  archivo_original: "DATA_PERFIL_PRODUCTIVO_CULTIVO.zip"
  archivo_usado: "SISAGRI.xlsx"
  tamano_zip_bytes: 241499686
  sha256_sisagri_xlsx: "b7dec236a0d65c7aada297118cab584104863e6f21430fe60e279cf5293e3283"
  licencia: "No declarada explícitamente en el portal; datos de una entidad pública peruana (MIDAGRI). Verificar términos de uso/redistribución antes de publicar datos derivados (sección 4.17)."

esquema:
  tiene_fila_cabecera: true
  hoja_con_cabecera: "Exportar Hoja de Trabajo"
  columnas_reales: ["AÑO", "MES", "COD_UBIGEO", "DEPARTAMENTO", "PROVINCIA", "DISTRITO", "COD_PRODUCTO", "PRODUCTO", "SIEMBRA", "COSECHA", "PRODUCCION", "VERDE_ACTUAL", "PRECIO_CHACRA"]
  nota_estructura: >
    El archivo tiene 5 hojas (Exportar Hoja de Trabajo, Sheet1, Sheet2,
    Sheet3, Sheet4) que son FRAGMENTOS CONSECUTIVOS de un único dataset,
    particionado únicamente por el límite de 1 048 576 filas de una hoja de
    Excel. Solo la primera hoja repite la fila de cabecera; las siguientes 4
    comparten el mismo esquema de columnas en el mismo orden sin repetirla.
  nota_tecnica_lectura: >
    Un metadato <dimension ref="A1"/> corrupto/desactualizado en el XML de
    la mayoría de las hojas (dejado por el exportador Apache POI) hace que
    openpyxl.load_workbook(read_only=True) — y cualquier lectura que dependa
    de streaming basado en ese metadato — trate esas hojas como vacías (1x1).
    pandas.read_excel(..., header=0) SIN modo read_only sí lee el contenido
    completo correctamente. Este fue un error real cometido y corregido
    durante la verificación de este archivo.
  columnas_no_confirmadas_semanticamente_pero_ahora_con_nombre_real:
    - "VERDE_ACTUAL: probablemente superficie en verde / aún no cosechada; no usada en el diseño del artefacto"
    - "PRECIO_CHACRA: precio en chacra (Soles/kg); no usada en el diseño del artefacto"

cobertura:
  granularidad_espacial: "distrito (más fina que la unidad de análisis de la tesis, provincia — sección 4.4); pendiente confirmar en H1 si agregar distrito->provincia o si ya vienen filas a nivel provincia"
  granularidad_temporal: "mes calendario (no campaña agrícola directa; se deriva con src.preprocessing.campaign_calendar)"
  rango_temporal_confirmado: "2015-02 a 2026-03 (confirmado por streaming del XML crudo de las 5 hojas, sin cargar el dataset completo en memoria)"
  filas_totales_aproximadas: 4283006
  filas_por_hoja:
    "Exportar Hoja de Trabajo": {filas: 1048002, rango: "2015-02 a 2018-03"}
    "Sheet1": {filas: 1048001, rango: "2018-03 a 2020-10"}
    "Sheet2": {filas: 1048001, rango: "2020-10 a 2023-04"}
    "Sheet3": {filas: 1048001, rango: "2023-04 a 2025-12"}
    "Sheet4": {filas: 90782, rango: "2025-12 a 2026-03"}
  cultivos_incluidos: "todos los cultivos transitorios y permanentes reportados por SIEA, incluye QUINUA (22014 filas de quinua contadas solo en la primera hoja)"

brecha_de_cobertura_respecto_a_la_tesis:
  delimitacion_tesis: "campañas 2005/2006 a 2023/2024 (año de cosecha 2006-2024), 19 campañas — sección 1.5"
  cobertura_real_disponible: "datos calendario 2015-02 a 2026-03; ver enmienda_metodologica abajo para el cálculo preciso de campañas COMPLETAS (con siembra y cosecha ambas dentro de los datos)"
  busqueda_de_fuente_alternativa: >
    Se buscó en SIEA-MIDAGRI un histórico tabular más largo (Boletines
    Anuales de Producción Agrícola,
    siea.midagri.gob.pe/publicaciones/datos-y-estadisticas-agrarias/
    boletines-anuales/produccion-agricola): solo hay boletines PDF
    individuales desde 2016 (no tabulares, no descargables como serie
    consolidada), y tampoco cubren 2006-2015. No se encontró una fuente
    tabular oficial vigente con la cobertura completa que exige la tesis.
  clasificacion_del_riesgo: "activación real del riesgo \"Cobertura provincial más corta que el periodo propuesto\" (Tabla 6 de la tesis)"
  respuesta_prevista_por_la_tesis: "acotar el periodo a la cobertura común, recalcular las campañas externas y documentar la enmienda antes del entrenamiento (sección 6.1, plan de contingencia, punto 1)"

# ---------------------------------------------------------------------------
# ENMIENDA METODOLÓGICA #1 — Reducción del periodo de estudio
# Formalizada siguiendo el plan de contingencia de la sección 6.1 de la
# tesis ("Cobertura temporal insuficiente"), como cierre parcial de la
# Actividad 1 / Hito H1 respecto a la fuente MIDAGRI/SIEA de rendimiento.
# ---------------------------------------------------------------------------
enmienda_metodologica:
  fecha: "2026-09-12"
  motivo: >
    La fuente tabular vigente de MIDAGRI/SIEA (ver `fuente` arriba) no
    reemplaza con cobertura completa a la citada originalmente en la tesis:
    cubre datos calendario desde 2015-02 hasta 2026-03, sin serie tabular
    alternativa disponible para 2006-2014 (ver
    `busqueda_de_fuente_alternativa`).

  calculo_de_campanas_completas: >
    Una campaña se considera COMPLETA solo si tanto su ventana de siembra
    (aproximadamente set-nov del año calendario t-1) como su ventana de
    cosecha (aproximadamente abr-jun del año de cosecha, sección 4.10.2)
    están dentro del rango de datos disponible. Aplicando esta regla a la
    cobertura confirmada (2015-02 a 2026-03):
      - Campaña 2015 (cosecha abr-jun 2015): EXCLUIDA — dependería de
        siembra set-nov 2014, anterior al inicio de los datos (2015-02).
      - Campañas 2016 a 2025: COMPLETAS — siembra y cosecha de cada una
        caen dentro de 2015-02 a 2026-03.
      - Campaña 2026 (cosecha abr-jun 2026): EXCLUIDA — los datos terminan
        en 2026-03, antes del cierre de la ventana de cosecha.

  periodo_original: "campañas de cosecha 2006 a 2024 (19 campañas) — sección 1.5 de la tesis"
  periodo_enmendado: "campañas de cosecha 2016 a 2025 (10 campañas)"
  campanas_excluidas_del_periodo_original: "2006 a 2015 (10 de 19 campañas — no existe fuente tabular oficial vigente para reconstruirlas)"

  impacto_en_el_diseno_experimental:
    reduccion_de_campanas: "de 19 a 10 campañas (-47.4%)"
    ventana_inicial_de_entrenamiento: >
      Con 10 campañas totales, la ventana inicial mínima para el esquema de
      origen móvil (expanding_window_splits, sección 4.12.1) debe reducirse
      respecto a cualquier valor pensado para 19 campañas. Con una ventana
      inicial de 5 (valor de referencia usado en las pruebas del pipeline,
      ver tests/evaluation/test_splits.py), solo quedan 5 campañas externas
      de evaluación — el mínimo práctico para que el bootstrap por bloques
      temporales (sección 4.14) y el contraste de Wilcoxon pareado (sección
      3.3.1-3.3.2) produzcan una estimación mínimamente estable. El valor
      final de la ventana inicial debe fijarse en el ensayo piloto (H2,
      sección 4.11) considerando este límite, no asumirse igual al pensado
      originalmente para 19 campañas.
    potencia_estadistica: >
      Un número tan reducido de campañas externas (5-8, según la ventana
      inicial elegida) limita la potencia para detectar diferencias pequeñas
      en los contrastes HE1a/HE1b/HE2a-c (sección 4.14: "cautela con
      diferencias pequeñas" ya advertida en la Tabla 10 de amenazas a la
      validez, "Pocos bloques temporales, dependencia y baja potencia").
      Este riesgo, ya contemplado como amenaza de conclusión en la tesis, se
      agrava con la reducción de periodo y debe reportarse explícitamente en
      los resultados finales, no solo en el diseño.
    validacion_leave_one_department_out: >
      No afectada en su mecánica (opera sobre departamentos, no campañas),
      pero cada pliegue de robustez espacial ahora se entrena con datos de
      solo 10 campañas en vez de 19, reduciendo también la cantidad de
      información disponible por pliegue.
    horizonte_de_pronostico: >
      No afectado en su definición (30 días antes de cosecha, o cierre de
      floración); sí puede haber menos observaciones para el análisis de
      sensibilidad por horizonte al operar sobre 10 campañas en vez de 19.

  alcance_de_la_generalizacion: >
    Las conclusiones del estudio quedan delimitadas al periodo 2016-2025.
    Cualquier extrapolación a campañas anteriores a 2016 (incluida la severa
    sequía de 2023 discutida en la sección 1.1 del planteamiento del
    problema, que SÍ cae dentro del periodo enmendado) debe declararse
    explícitamente como fuera del rango de entrenamiento cuando corresponda
    a años fuera de 2016-2025.

  decisiones_que_requieren_actualizacion_en_el_documento_de_tesis:
    - "Sección 1.5 (Alcance y delimitación): actualizar 'Delimitación temporal' de 19 a 10 campañas (2016-2025)."
    - "Sección 4.5 (Población de estudio) y Tabla 5 (cálculo escalonado N0-N5): recalcular N0 con 10 campañas en vez de 19 (N0 pasaría de 80×19=1520 a 80×10=800, antes de aplicar las exclusiones territoriales de N1-N3)."
    - "Sección 4.5.7 (Bloques temporales): el número de bloques temporales potenciales pasa de 19 a 10."
    - "Sección 4.12.1 (Esquemas de validación): la ventana inicial mínima de origen móvil debe redefinirse considerando el límite práctico señalado arriba, no un valor pensado para 19 campañas."
    - "Capítulo 6 (Cronograma): sin impacto directo en fechas de actividades, pero la Actividad 1 (auditoría H1) debe registrar esta enmienda como su resultado formal respecto a la fuente de rendimiento."

  estado: "PROPUESTA — pendiente de aprobación del asesor antes de proceder al entrenamiento definitivo (sección 6.1: toda modificación que afecte la unidad de análisis, el periodo o el diseño confirmatorio requiere enmienda metodológica previa y trazable)."

# ---------------------------------------------------------------------------
# RESULTADO DE LA AUDITORÍA H1 — Cascada N0-N4 ejecutada con datos reales
# Referencia: sección 4.5.6, Tabla 5. Ejecutado con scripts/compute_n4_n5.py
# sobre las 5 hojas del archivo real (~4.3 millones de filas, 15 137
# registros mensuales de quinua en los 8 departamentos delimitados).
# ---------------------------------------------------------------------------
resultado_auditoria_h1:
  fecha_ejecucion: "2026-09-12"
  archivos_generados:
    - "configs/provincias.csv (80 provincias, Tabla 3-4, verificadas contra el nombre real de provincia en SISAGRI.xlsx)"
    - "configs/produccion_documentada.csv (62 provincias con producción documentada preliminar, Tabla 3)"
    - "data/interim/celdas_con_produccion.csv (730 celdas provincia-campaña agregadas desde los registros mensuales reales)"
    - "reports/E1_matriz_cobertura_original_2006_2024.json"
    - "reports/E1_matriz_cobertura_enmendado_2016_2025.json"

  hallazgo_de_clasificacion_territorial: >
    Se detectó y corrigió una inconsistencia en la clasificación territorial
    preliminar: Gran Chimú (La Libertad) está marcada en la Tabla 3 como
    "requiere verificación", pero a diferencia de Carabaya/Sandia (Puno) y La
    Mar/Huanta (Ayacucho) —que SÍ se cuentan dentro de las "preliminares de
    sierra" de su departamento y por tanto permanecen en N2— Gran Chimú NO
    forma parte de las "6 preliminares" declaradas para La Libertad. Se
    introdujo la categoría ClasificacionTerritorial.PENDIENTE_VERIFICACION
    (excluida de N2, distinta de TRANSICION que sí se incluye) para reflejar
    esta distinción. Sin esta corrección, N2 calculado era 1292 en vez de
    1273 (la cifra oficial de la Tabla 5).

  hallazgo_de_bugs_en_el_calculo_de_n4: >
    Se detectaron y corrigieron dos errores reales en
    src.ingestion.audit.build_coverage_cascade al ejecutarla contra el
    archivo real (no se manifestaban con los datos sintéticos de prueba
    previos):
      1. N4 no filtraba celdas_con_produccion contra las provincias
         elegibles en N3 — una celda con producción registrada en una
         provincia ya excluida (costa, selva, pendiente_verificacion, sin
         producción documentada) inflaba N4 por encima de N3, violando la
         monotonicidad de la cascada (sección 4.5.6).
      2. N4 no filtraba por el rango de campañas del periodo delimitado — el
         archivo real contiene registros de las campañas 2015 y 2026, ya
         excluidas por la enmienda de periodo (ver
         calculo_de_campanas_completas arriba), que inflaban N4 si no se
         excluían explícitamente. Se agregó el parámetro `campanas_validas`
         a build_coverage_cascade.

  cascada_periodo_original_2006_2024:
    N0: 1520
    N1: 1463
    N2: 1273
    N3: 1178
    N4: 568
    N5: null
    nota: >
      N0-N3 coinciden EXACTAMENTE con los valores de la Tabla 5 de la tesis
      (1520, 1463, 1273, 1178), confirmando que la clasificación territorial
      construida en configs/provincias.csv es fiel a la Tabla 3-4. N4=568 no
      es directamente comparable con N3=1178 como "cobertura real del
      periodo completo": representa las celdas con producción > 0
      SOLO dentro de las campañas 2016-2024 (9 de las 19 campañas del
      periodo original), ya que 2006-2015 no tiene fuente tabular
      disponible (ver enmienda_metodologica).

  cascada_periodo_enmendado_2016_2025:
    N0: 800
    N1: 770
    N2: 670
    N3: 620
    N4: 604
    N5: null
    nota: >
      Cobertura real del 97.4% (604 de 620 celdas elegibles) dentro del
      periodo con fuente tabular disponible — una cobertura muy alta,
      consistente con el hecho de que el archivo real es un registro
      administrativo directo de MIDAGRI, no una encuesta muestral. N5 queda
      pendiente hasta definir el criterio de completitud de predictores
      (sección 4.7) sobre las series agroclimáticas y espectrales, aún no
      construidas (dependen de la ingesta de CHIRPS/ERA5-Land/MODIS vía
      Google Earth Engine).

  hallazgo_adicional_pendiente_de_revision: >
    Se observaron 76 provincias distintas con al menos un registro de
    producción de quinua > 0 en 2016-2025, más que las 62 marcadas como "con
    producción documentada" en la Tabla 3 de la tesis (N3). Esto sugiere que
    algunas provincias fuera del universo N3 preliminar sí registran
    producción real en MIDAGRI — no se investigó a fondo cuáles son ni si
    corresponde ampliar N3, ya que la tesis fija ese universo de forma
    preespecificada (Tabla 3) y cualquier ampliación sería una enmienda
    adicional a evaluar con el asesor, no una corrección automática.

pendiente:
  - "Confirmar en H1 si las filas a nivel distrito deben sumarse a nivel provincia"
  - "Obtener aprobación formal del asesor para la enmienda de periodo (2016-2025) antes de proceder a la Actividad 4 (integración del conjunto de datos)"
  - "Verificar con SENAMHI/INEI si existe otra fuente de rendimiento/producción/superficie a nivel provincial que sí cubra 2006-2015, antes de dar por definitiva la reducción del periodo"
  - "Definir en el ensayo piloto (H2) la ventana inicial de entrenamiento del esquema de origen móvil, considerando el límite práctico de solo 10 campañas totales"
  - "Evaluar con el asesor si ampliar N3 a las 76 provincias con producción real observada (14 más que las 62 preespecificadas en la Tabla 3) constituye una enmienda deseable, dado que la tesis fija ese universo de forma preespecificada"
  - "Confirmar si N4 (604/620) es representativo o si hay un patrón sistemático en las 16 celdas sin producción (¿provincias específicas ausentes en ciertos años, o distribuidas al azar?)"
