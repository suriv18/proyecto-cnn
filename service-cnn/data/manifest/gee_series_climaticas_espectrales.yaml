# Manifiesto de datos: series climáticas/espectrales vía Google Earth Engine
# (sección 4.9, Tabla 7; sección 4.18 — manifiesto de datos).
#
# Extracción real ejecutada contra la API de Earth Engine (proyecto de Google
# Cloud "cnn-sentinel"), no simulada. Generada por scripts/run_ingestion.py,
# que invoca src.ingestion.gee_extraction_pipeline.extract_all_provinces_all_
# variables sobre las geometrías reales de src.ingestion.province_geometries
# (FAO/GAUL/2015/level2, 80/80 provincias encontradas).

fuente:
  proveedor: "Google Earth Engine (proyecto Google Cloud: cnn-sentinel)"
  fecha_extraccion: "2026-09-12"
  colecciones:
    precipitacion:
      collection_id: "UCSB-CHG/CHIRPS/DAILY"
      banda: "precipitation"
      resolucion_espacial_m: 5566
      resolucion_temporal: "diaria"
      unidad_real: "mm/día"
    temperatura_maxima:
      collection_id: "ECMWF/ERA5_LAND/DAILY_AGGR"
      banda: "temperature_2m_max"
      resolucion_espacial_m: 11132
      resolucion_temporal: "diaria"
      unidad_real: "°C (convertido desde Kelvin, offset -273.15)"
    temperatura_minima:
      collection_id: "ECMWF/ERA5_LAND/DAILY_AGGR"
      banda: "temperature_2m_min"
      resolucion_espacial_m: 11132
      resolucion_temporal: "diaria"
      unidad_real: "°C (convertido desde Kelvin, offset -273.15)"
    radiacion_solar:
      collection_id: "ECMWF/ERA5_LAND/DAILY_AGGR"
      banda: "surface_solar_radiation_downwards_sum"
      resolucion_espacial_m: 11132
      resolucion_temporal: "diaria"
      unidad_real: "J/m² acumulado por día"
    ndvi:
      collection_id: "MODIS/061/MOD13Q1"
      banda: "NDVI"
      resolucion_espacial_m: 250
      resolucion_temporal: "16 días (compuesto)"
      unidad_real: "adimensional [-1, 1] (convertido desde entero crudo, factor 0.0001)"
  geometrias:
    dataset: "FAO/GAUL/2015/level2"
    provincias_esperadas: 80
    provincias_encontradas: 80
    nota: >
      Nombres de provincia y departamento normalizados (tildes/mayúsculas)
      entre configs/provincias.csv (convención MIDAGRI) y GAUL — ver
      src.ingestion.province_geometries.normalize_province_name y
      DEPARTAMENTOS_GAUL. Verificado 80/80 sin faltantes.

esquema_del_archivo_generado:
  # Parquet COMPUESTO (2026-10-10): cada variable proviene de la corrida cuyo
  # método es el correcto; ver `procedencia_por_variable` y el incidente en
  # `bugs_reales_detectados_y_corregidos_durante_esta_extraccion`.
  ruta: "data/raw/gee_series_crudo.parquet"
  columnas: ["provincia_id", "fecha", "variable", "campana_id", "valor", "valor_mean", "valor_max"]
  sha256: "6e7a991a53c8eba2edcb4ab3a9597bf48d300f40659195e92cc3b5c81b9f1a9f"
  tamano_bytes: 10279571
  filas_totales: 1148160
  filas_por_variable:
    precipitacion: 282640
    temperatura_maxima: 282640
    temperatura_minima: 282640
    radiacion_solar: 282640
    ndvi: 17600
  valores_nulos:
    nota: >
      `valor` solo aplica a las 4 variables climáticas y `valor_mean`/`valor_max`
      solo a NDVI (nulos estructurales). NDVI: 2235 de 17600 filas (12.7 %) sin
      valor porque la máscara agrícola o el filtro de calidad dejaron la
      provincia sin píxeles válidos en esa fecha; 70 provincia-campañas sin
      ningún NDVI válido = 7 provincias (ASCOPE, CAMANA, CHEPEN, ISLAY,
      PACASMAYO, SATIPO, VIRU) x 10 campañas, costeras o de selva, que la
      máscara de altitud excluye por diseño (N2 de la Tabla 5).
  rango_de_campanas: "2016-2025 (10 campañas, periodo enmendado — ver data/manifest/midagri_sisagri.yaml, enmienda_metodologica)"

procedencia_por_variable:
  precipitacion_temperaturas_radiacion:
    corrida: "2026-09-12 (copia local: data/raw/gee_series_crudo_esquema_ndvi_antiguo.parquet, no versionada)"
    reductor_espacial: "media sobre los píxeles de la provincia"
    verificacion: >
      2026-10-10: el código corregido (reductor espacial = media) reproduce estas
      filas exactamente (58 filas x 4 variables, 2 provincias, nov-2018,
      tolerancia 1e-6), por lo que no se repitió la extracción.
  ndvi:
    corrida: "2026-10-09/10 (scripts/run_ingestion.py, ~3 h 30 min, 600 llamadas, sin fallos)"
    mascara_agricola: >
      Aplicada (data/manifest/mascara_agricola.yaml: cultivo WorldCover, 2500-4000 m,
      pendiente <= 14.04 grados, amplitud >= 0.323). Umbrales PROVISIONALES
      pendientes de aprobación del asesor.
    filtro_de_calidad: "DetailedQA: VI Quality <= 1, sin nube adyacente ni nubes mixtas"
    reducers: "media y máximo espaciales por imagen (valor_mean, valor_max)"
  archivos_no_versionados_conservados:
    - "data/raw/gee_series_crudo_corrida_20261010_4var_invalidas_suma_espacial.parquet — corrida con las 4 variables climáticas INVÁLIDAS (suma espacial); no usar"

cobertura:
  provincias_unicas: 80
  campanas: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  ventana_de_extraccion_por_campana: >
    Año calendario completo del ciclo agrícola (1 jul del año anterior a 30
    jun del año de cosecha) — ver
    src.ingestion.gee_extraction_pipeline.campana_a_ventana_extraccion. Es
    una ventana AMPLIA, no las fases fenológicas finales: la alineación fina
    a fases BBCH (sección 4.10.2) ocurre en preprocessing/phenology.py,
    usando esta serie cruda como insumo (incluyendo NDVI, respaldo de nivel
    2 para estimar la fecha de siembra).
  rangos_fisicos_observados:
    precipitacion_mm_dia: [0.0, 104.2]
    temperatura_maxima_c: [1.1, 31.5]
    temperatura_minima_c: [-14.4, 23.9]
    radiacion_solar_j_m2: [3056131, 35413960]
    ndvi_valor_mean: [0.1698, 0.878]   # con máscara agrícola y filtro de calidad (2026-10-10)
    ndvi_valor_max: [0.188, 0.999]
  nota_validacion: >
    Rangos verificados como fisicamente coherentes con clima de sierra
    altoandina (heladas nocturnas en temporada seca, NDVI de vegetación
    real). No se detectaron valores nulos ni fuera de rango físico
    plausible.

bugs_reales_detectados_y_corregidos_durante_esta_extraccion:
  - descripcion: >
      GeeClient.extract_daily_series usaba reducer=None en reduceRegions(),
      que pasaba los tests con doble de prueba (que ignoraba ese parámetro)
      pero fallaba contra la API real con "Parameter 'reducer' is required
      and may not be null."
    fix: >
      Se reduce cada imagen por separado con ee.Reducer.mean() explícito, se
      le agrega la fecha como propiedad, y se aplana con .flatten() — patrón
      verificado manualmente contra la API real antes de aplicarlo.
  - descripcion: >
      El enfoque anterior (.toBands()) producía estructura ANCHA (una
      columna por fecha) en vez del formato LARGO (provincia_id, fecha,
      valor) documentado en el docstring.
    fix: "Reemplazado por el patrón .map() + .flatten() por imagen (ver arriba)."
  - descripcion: >
      gee_config.py referenciaba ECMWF/ERA5_LAND/HOURLY con bandas
      temperature_2m_max/min y surface_solar_radiation_downwards, que no
      existen en esa colección horaria (solo valores instantáneos).
    fix: "Cambiado a ECMWF/ERA5_LAND/DAILY_AGGR, que sí expone esas bandas agregadas por día."
  - descripcion: >
      NDVI (MOD13Q1) se extraía como entero crudo sin escalar (rango
      -2000..10000) y la temperatura ERA5-Land en Kelvin sin convertir a
      Celsius.
    fix: >
      Se agregó factor_escala/offset_aditivo a GeeCollectionSpec, aplicado
      en GeeClient.extract_daily_series (NDVI x0.0001; temperatura -273.15).
  - descripcion: >
      FeatureCollection.getInfo() aborta con "Collection query aborted after
      accumulating over 5000 elements" al pedir un año diario completo x 80
      provincias (29 200 elementos, sobre el límite real de Earth Engine).
    fix: >
      Se pagina cada campaña en meses calendario (dividir_en_meses, máx 80 x
      31 = 2480 elementos por llamada).
  - descripcion: >
      Una extracción secuencial de 600 llamadas (10 campañas x 5 variables x
      12 meses) tardaría más de 10 horas — cuello de botella de espera de
      red/deserialización JSON del lado cliente, no de cómputo local puro.
    fix: >
      Se paraleliza con concurrent.futures.ThreadPoolExecutor
      (max_workers=8 en la ejecución real). Tiempo real observado: ~2h34min
      para las 600 llamadas (más lento de lo estimado por contención de
      GIL en deserialización JSON pesada, pero sin fallos).

  - descripcion: >
      REGRESIÓN (commit de73679, 2026-09-13; detectada el 2026-10-10 al
      verificar la re-extracción con máscara): GeeClient.extract_daily_series
      pasó a usar la regla TEMPORAL de agregación por fase (`aggregation` del
      spec: suma, máximo, mínimo) como reductor ESPACIAL de reduceRegions. La
      precipitación diaria de una provincia salía como la suma de ~177 píxeles
      CHIRPS (114.06 mm el 2018-07-03 en Azángaro frente a la media real de
      0.649 mm; máximo 85 970 mm), la radiación ~25 veces su valor real, y las
      temperaturas el máximo/mínimo espacial en vez del promedio provincial. Los
      tests existentes fijaban el comportamiento erróneo (filas simuladas con
      claves "sum"/"max" y aserción SUM_REDUCER). Costó una corrida de 3 h 30 min
      cuyas 4 variables climáticas hubo que descartar.
    fix: >
      El reductor espacial es siempre la media (`reducers = spec.reducers if
      spec.reducers else (AggregationRule.MEAN,)`); la regla temporal se aplica
      después por fase en gee_series_builder. Tests corregidos y 4 tests nuevos.
      Control permanente: preprocessing_pipeline.validate_raw_ranges rechaza
      series fuera de los límites físicos (probado: rechaza el parquet
      erróneo y acepta el final).
  - descripcion: >
      reduceRegions con reducers combinados sobre una imagen de UNA banda
      devuelve las propiedades `mean`/`max` a secas (no `NDVI_mean`/`NDVI_max`,
      como describe la guía de Earth Engine); el código y los dobles de prueba
      asumían el prefijo y habrían fallado con KeyError en la corrida real.
    fix: "Verificado contra la API real el 2026-10-09; se lee `mean`/`max` con el prefijo como alternativa."

