  - "Conectar esta serie cruda con src.preprocessing.phenology para la alineación fenológica fina a fases BBCH (Actividad 4)."
  - "Confirmar con el asesor si la ventana de extracción amplia (año calendario del ciclo agrícola) es la interpretación correcta antes de proceder a la Actividad 4."
