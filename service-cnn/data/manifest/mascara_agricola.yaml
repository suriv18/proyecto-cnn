# Manifiesto de datos: máscara de superficie agrícola
# (sección 4.10.1, Tabla 7 §4.9; sección 4.18 — manifiesto de datos).
#
# La tesis (sección 4.10.1) exige registrar "el nombre, versión, resolución y
# fecha de cada capa, así como los umbrales de altitud, pendiente y amplitud"
# antes de la evaluación definitiva — este manifiesto es ese registro.
# Implementación: src.ingestion.gee_mask_pipeline (build_agricultural_mask_
# image, sample_cells_for_calibration). Aún NO ejecutado contra la API real
# de Earth Engine (ver `pendiente` al final) — este manifiesto documenta las
# fuentes y umbrales ya decididos, no una extracción ya realizada.

fuentes_de_datos:
  cobertura_de_suelo:
    proveedor: "ESA WorldCover"
    version: "v200"
    fecha_producto: "2021"
    collection_id_gee: "ESA/WorldCover/v200/2021"
    banda: "Map"
    resolucion_espacial_m: 10
    clase_agricola: 40  # "Cropland" en el catálogo oficial ESA WorldCover
    nota: >
      Estático para las 10 campañas (2016-2025): una sola fecha de producto,
      asumiendo que la cobertura de suelo cambia lento en zonas de sierra
      altoandina en esta escala temporal — aproximación aceptada, no
      verificada campaña a campaña.
    verificacion: >
      VERIFICADO 2026-10-09 contra la API real: la leyenda oficial de la
      imagen (Map_class_values/Map_class_names) asigna 40 = "Cropland". Un
      muestreo en 8 provincias muestra además que el 99.3 % de las celdas
      de cultivo cae dentro de 2500-4000 msnm.

  modelo_digital_de_elevacion:
    proveedor: "USGS SRTM"
    version: "SRTMGL1 v003 (1 arc-second)"
    collection_id_gee: "USGS/SRTMGL1_003"
    banda: "elevation"
    resolucion_espacial_m: 30
    pendiente_derivada_via: "ee.Terrain.slope() sobre la banda elevation"
    verificacion: >
      VERIFICADO 2026-10-09 contra la API real: ee.Terrain.slope() devuelve
      grados (máximo 58.4° y media 14.9° en el valle de Cusco; siempre <= 90).
      Con el umbral de 14.04°, el 91.2 % de las celdas de cultivo muestreadas
      lo cumple (el 8.8 % restante queda excluido por pendiente).

  amplitud_ndvi:
    proveedor: "MODIS MOD13Q1 V061 (mismo que Tabla 7)"
    collection_id_gee: "MODIS/061/MOD13Q1"
    banda: "NDVI"
    resolucion_espacial_m: 250
    calculo: >
      max() - min() sobre la ventana de CAMPAÑA completa (no un año fijo ni
      la ventana mensual de paginación), escalado por factor_escala=0.0001
      (ver src.ingestion.gee_config.get_collection_spec("ndvi")) — consistente
      con el resto del pipeline de extracción NDVI (Tabla 7).

umbrales:
  # Valores planos, consumidos directamente por
  # src.ingestion.mask_manifest.load_mask_thresholds para construir
  # MaskThresholds (src.preprocessing.mask) — ver el detalle de cada uno
  # (fuente, estado) en la subsección `detalle` inmediatamente abajo.
  altitud_min_m: 2500
  altitud_max_m: 4000
  pendiente_max_porcentaje: 25
  pendiente_max_grados: 14.04  # arctan(0.25), redondeado a 2 decimales
  amplitud_ndvi_min: 0.323  # percentil 5 de la amplitud del cultivo elegible, campañas 2016-2020
  # 2026-10-10: con ventana inicial 5 las campañas 2016-2020 son todas de entrenamiento, así que 0.323 es válido sin recalibrar.
  # (Si se adoptara ventana 4, p5 con 2016-2019 sería 0.319; ver reports/calibracion_mascara_amplitud_2016_2020.json y el registro de decisiones.)

  detalle:
    altitud:
      fuente: >
        PROINPA/FAO, informe técnico presentado al Congreso de la
        República del Perú (2011), "La quinua: Cultivo milenario para
        contribuir a la seguridad alimentaria mundial", sección 4.2 "El
        cultivo y la capacidad de adaptación al cambio climático" —
        describe 5 grupos ecotípicos de quinua por rango altitudinal
        (Lescano 1989; Tapia 1990), de los cuales 2 son relevantes para
        los 8 departamentos del estudio:
          - "Quinuas de valles interandinos": 2500-3500 msnm (aplica a
            Apurímac, Ayacucho, Huancavelica, Cusco, Junín, La Libertad).
          - "Quinuas de altiplano": 3600-3800 msnm (aplica a Puno).
        Adicionalmente, Espíndola (1986), citado en el mismo informe: "Los
        límites altitudinales del Altiplano son de 3000 a 4000 metros
        sobre el nivel del mar" — usado para fijar el límite superior
        (4000 msnm) que cubre con margen el rango de altiplano.
        URL: https://www2.congreso.gob.pe/sicr/cendocbib/con4_uibd.nsf/EA85F3E4F4B5AFD405257E85005CEFD4/$FILE/LaQuinua_CultivoMilenarioPag_1_33.pdf
      estado: "PROVISIONAL — pendiente de aprobación del asesor"

    pendiente:
      fuente: >
        Decreto Supremo N° 005-2022-MIDAGRI, "Reglamento de Clasificación
        de Tierras por su Capacidad de Uso Mayor" (RCTCUM), Anexo III,
        Clave 5 ("Estepa - Montano Tropical / Subtropical" — la zona de
        vida Holdridge típica de la sierra alta peruana donde se cultiva
        quinua en secano): grupo A "Cultivo en Limpio (secano)" admite
        pendiente hasta 25% en su tramo más permisivo documentado (8-25%).
        El reglamento expresa pendiente en PORCENTAJE, no en grados —
        convertido matemáticamente (arctan(0.25) = 14.04°) para uso
        directo en MaskThresholds.pendiente_max_grados.
        Publicado en El Peruano, 24 de abril de 2022.
        URL: https://dar.org.pe/wp-content/uploads/2022/04/2060758-1-1.pdf
      estado: "PROVISIONAL — pendiente de aprobación del asesor"

    amplitud_ndvi:
      fuente: >
        Calibrado estadísticamente (la tesis, sección 4.10.1, exige que este
        umbral NO se fije por literatura) con scripts/calibrate_mask_amplitude.py
        sobre las campañas de ENTRENAMIENTO 2016-2020 (con origen móvil forman
        parte del entrenamiento de cualquier pliego con ventana inicial >= 5;
        regla anti-fuga, sección 4.12.2). Muestra: 60 celdas de cultivo
        (WorldCover clase 40, 250 m, seed 42) por provincia en las 80
        provincias, 22 615 celdas-campaña, 15 145 elegibles tras altitud y
        pendiente. Amplitud = max - min del NDVI MODIS en la ventana de
        campaña, sin filtro de calidad (igual que la máscara de producción).
        Detalle: reports/calibracion_mascara_amplitud.json.
        Percentiles evaluados (umbral / % de celdas elegibles excluidas):
          p1 = 0.251 / 1 %; p5 = 0.323 / 5 %; p10 = 0.361 / 10 %; p25 = 0.419 / 25 %.
        Se registra el percentil 5 como propuesta. ADVERTENCIA de sesgo
        regional: la amplitud es menor en zonas áridas/altiplánicas, por lo que
        el mismo umbral excluye más celdas en Arequipa (p5: 20 %) y Puno (p5:
        9 %, principal productor) que en Apurímac (1 %) o Cusco (2 %); con p1
        el sesgo casi desaparece (Arequipa 7 %, Puno 1 %) pero el filtro es
        casi nulo. La elección del percentil es un compromiso a decidir con el
        asesor; el efecto debe cubrirse en el análisis de sensibilidad por
        umbral (4.10.1).
      estado: "PROVISIONAL — percentil 5 propuesto (2026-10-09); pendiente de aprobación del asesor"

pendiente:
  - "Aprobación formal del asesor para altitud_min_m/altitud_max_m/pendiente_max_grados — provisionales hasta entonces."
  - "Aprobación del asesor del percentil de amplitud_ndvi_min (hoy p5 = 0.323, provisional) considerando el sesgo regional (Arequipa, Puno)."
  - "FAO/GAUL/2015/level2 (geometrías provinciales) está marcado como obsoleto por Earth Engine (superado por FAO/GAUL/2025/level2): migrar o fijar el asset antes de que se retire."
  - "Re-ejecutar la extracción real de NDVI (GeeClient.extract_daily_series, filtrado de calidad + media/máximo) y de la máscara agrícola (extract_masked_ndvi_series, aún sin el mismo filtrado — ver docs/PENDIENTE.md) contra la API real de GEE, una vez los umbrales estén aprobados."
