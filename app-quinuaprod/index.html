<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app-quinuaprod</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar un destello claro.
      try {
        var t = localStorage.getItem('quinuaprod-tema')
        var oscuro = t === 'oscuro' || ((t === null || t === 'sistema') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
